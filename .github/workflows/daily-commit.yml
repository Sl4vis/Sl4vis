name: Daily Streak Commit

on:
  schedule:
    # Dva spúšťače kvôli posunu CET/CEST.
    # Duplicitný commit v ten istý deň zabráni kontrola v .streak/log.md.
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit daily streak záznam
        env:
          TZ: Europe/Bratislava
        run: |
          set -euo pipefail

          TODAY=$(date +%F)
          mkdir -p .streak

          if [ -f .streak/log.md ] && grep -q "^- ${TODAY}" .streak/log.md; then
            echo "Pre ${TODAY} už commit existuje — preskakujem."
            exit 0
          fi

          if [ ! -f .streak/log.md ]; then
            printf '# Streak log\n\n' > .streak/log.md
          fi
          printf -- '- %s %s\n' "$TODAY" "$(date +%H:%M\ %Z)" >> .streak/log.md

          git config user.name "Slavo"
          git config user.email "160755890+Sl4vis@users.noreply.github.com"
          git add .streak/log.md
          git commit -m "chore: daily update ${TODAY}"

          for i in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            echo "Push zlyhal, skúšam znova o $((2**i))s..."
            sleep $((2**i))
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          echo "Push sa nepodaril." >&2
          exit 1
