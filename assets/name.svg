<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Sl4vis" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- rainbow sweep, spreadMethod=repeat -> nekonecna slucka bez skoku -->
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="repeat">
      <stop offset="0.00" stop-color="#FF4D6D"/>
      <stop offset="0.16" stop-color="#FF9F45"/>
      <stop offset="0.32" stop-color="#FFE066"/>
      <stop offset="0.48" stop-color="#3ECF8E"/>
      <stop offset="0.64" stop-color="#38E1E1"/>
      <stop offset="0.80" stop-color="#58A6FF"/>
      <stop offset="0.92" stop-color="#B06BFF"/>
      <stop offset="1.00" stop-color="#FF4D6D"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="420 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131c27"/>
    </linearGradient>

    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="repeat">
      <stop offset="0.00" stop-color="#FF4D6D"/>
      <stop offset="0.25" stop-color="#FFE066"/>
      <stop offset="0.50" stop-color="#3ECF8E"/>
      <stop offset="0.75" stop-color="#58A6FF"/>
      <stop offset="1.00" stop-color="#FF4D6D"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="420 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="900" height="190" rx="18" fill="url(#bgGrad)"/>
  <rect width="900" height="190" rx="18" fill="url(#dots)" opacity="0.4"/>
  <ellipse cx="450" cy="95" rx="330" ry="80" fill="url(#halo)"/>

  <!-- rozmazana kopia pod textom = jemna ziara -->
  <text x="450" y="112" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" letter-spacing="3"
        fill="url(#rainbow)" filter="url(#soft)" opacity="0.55">Sl4vis</text>

  <text x="450" y="112" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" letter-spacing="3"
        fill="url(#rainbow)">Sl4vis</text>

  <!-- animovana linka pod menom -->
  <rect x="330" y="136" width="240" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- rohove akcenty -->
  <g stroke="#232c38" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M34 26 L34 46 M34 26 L54 26"/>
    <path d="M866 164 L866 144 M866 164 L846 164"/>
  </g>
</svg>
