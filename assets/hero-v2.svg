<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-label="Multi-camera motion capture rig tracking a rehabilitation patient" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="coneL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ECF8E" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coneR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#3ECF8E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#58A6FF" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#9BD1FF" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#58A6FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#9BD1FF" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#9BD1FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="438" height="328" rx="16" fill="url(#bg)" stroke="#232c38"/>
  <rect x="1" y="1" width="438" height="328" rx="16" fill="url(#grid)" opacity="0.45"/>
  <ellipse cx="220" cy="220" rx="132" ry="62" fill="url(#glow)"/>

  <!-- view cones -->
  <polygon points="74,200 212,126 234,240" fill="url(#coneL)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="366,200 228,126 206,240" fill="url(#coneR)">
    <animate attributeName="opacity" values="1;0.6;1" dur="3.6s" repeatCount="indefinite"/>
  </polygon>

  <!-- floor -->
  <line x1="48" y1="276" x2="392" y2="276" stroke="#232c38" stroke-width="2"/>
  <ellipse cx="220" cy="276" rx="48" ry="8" fill="#3ECF8E" opacity="0.10"/>

  <!-- skeleton -->
  <g stroke="#3ECF8E" stroke-width="2.6" stroke-linecap="round" fill="none">
    <line x1="220" y1="180" x2="220" y2="226"/>
    <line x1="220" y1="226" x2="206" y2="270"/>
    <line x1="220" y1="226" x2="234" y2="270"/>
    <line x1="220" y1="192" x2="198" y2="214"/>
    <line x1="198" y1="214" x2="192" y2="240"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 220 192; -48 220 192; 0 220 192"
                        dur="4.2s" repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      <line x1="220" y1="192" x2="244" y2="212"/>
      <line x1="244" y1="212" x2="252" y2="238"/>
      <circle cx="244" cy="212" r="3.4" fill="#0d1117" stroke="#3ECF8E" stroke-width="2"/>
      <circle cx="252" cy="238" r="4.2" fill="#3ECF8E" stroke="none">
        <animate attributeName="r" values="4.2;6.8;4.2" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.45;1" dur="1.7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <circle cx="220" cy="164" r="12" fill="#0d1117" stroke="#3ECF8E" stroke-width="2.6"/>
  <g fill="#0d1117" stroke="#3ECF8E" stroke-width="2">
    <circle cx="220" cy="180" r="3.4"/>
    <circle cx="220" cy="226" r="3.4"/>
    <circle cx="198" cy="214" r="3.4"/>
    <circle cx="206" cy="270" r="3.4"/>
    <circle cx="234" cy="270" r="3.4"/>
  </g>

  <!-- scan sweep -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 128; 0 0" dur="5s" repeatCount="indefinite"
                      calcMode="spline" keyTimes="0;0.5;1"
                      keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <rect x="164" y="132" width="112" height="34" fill="url(#scanBand)"/>
    <rect x="164" y="148.5" width="112" height="1.6" fill="url(#scanEdge)"/>
  </g>

  <!-- camera left -->
  <g stroke="#3d4757" stroke-width="3" stroke-linecap="round">
    <line x1="74" y1="210" x2="62" y2="276"/>
    <line x1="74" y1="210" x2="86" y2="276"/>
    <line x1="74" y1="210" x2="74" y2="276"/>
  </g>
  <rect x="48" y="180" width="46" height="28" rx="6" fill="#161d27" stroke="#3ECF8E" stroke-width="2"/>
  <rect x="90" y="188" width="10" height="12" rx="3" fill="#161d27" stroke="#3ECF8E" stroke-width="2"/>
  <circle cx="65" cy="194" r="7.5" fill="#0d1117" stroke="#3ECF8E" stroke-width="2"/>
  <circle cx="65" cy="194" r="3" fill="#3ECF8E" opacity="0.85"/>
  <circle cx="82" cy="186" r="2.6" fill="#3ECF8E">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- camera right -->
  <g stroke="#3d4757" stroke-width="3" stroke-linecap="round">
    <line x1="366" y1="210" x2="354" y2="276"/>
    <line x1="366" y1="210" x2="378" y2="276"/>
    <line x1="366" y1="210" x2="366" y2="276"/>
  </g>
  <rect x="346" y="180" width="46" height="28" rx="6" fill="#161d27" stroke="#58A6FF" stroke-width="2"/>
  <rect x="340" y="188" width="10" height="12" rx="3" fill="#161d27" stroke="#58A6FF" stroke-width="2"/>
  <circle cx="375" cy="194" r="7.5" fill="#0d1117" stroke="#58A6FF" stroke-width="2"/>
  <circle cx="375" cy="194" r="3" fill="#58A6FF" opacity="0.85"/>
  <circle cx="358" cy="186" r="2.6" fill="#58A6FF">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- HUD panel -->
  <rect x="142" y="24" width="156" height="82" rx="10" fill="#0f1620" stroke="#232c38"/>
  <line x1="142" y1="48" x2="298" y2="48" stroke="#232c38"/>
  <text x="156" y="41" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#7d8b9e" letter-spacing="0.6">policy reward</text>
  <circle cx="286" cy="37" r="3.2" fill="#3ECF8E">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <polyline points="156,94 174,88 190,77 207,79 223,68 241,63 261,57 282,60"
            fill="none" stroke="#3ECF8E" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round" opacity="0.16"/>
  <polyline points="156,94 174,88 190,77 207,79 223,68 241,63 261,57 282,60"
            fill="none" stroke="#3ECF8E" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round" stroke-dasharray="190" stroke-dashoffset="190">
    <animate attributeName="stroke-dashoffset" values="190;0;0;190" dur="5.5s" repeatCount="indefinite"/>
  </polyline>

  <!-- camera labels -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#6e7c8e" letter-spacing="0.8">
    <text x="48" y="170">CAM 01</text>
    <text x="346" y="170">CAM 02</text>
  </g>
</svg>
