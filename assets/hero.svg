<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-label="Multi-camera motion capture rig tracking a rehabilitation patient" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="coneL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ECF8E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coneR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#3ECF8E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="438" height="328" rx="16" fill="url(#bg)" stroke="#232c38"/>
  <rect x="1" y="1" width="438" height="328" rx="16" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="220" cy="215" rx="130" ry="60" fill="url(#glow)"/>

  <!-- ==== view cones ==== -->
  <g>
    <polygon points="72,196 210,120 232,236" fill="url(#coneL)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="368,196 230,120 208,236" fill="url(#coneR)">
      <animate attributeName="opacity" values="1;0.55;1" dur="3.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- ==== floor ==== -->
  <line x1="45" y1="272" x2="395" y2="272" stroke="#232c38" stroke-width="2"/>
  <ellipse cx="220" cy="272" rx="46" ry="8" fill="#3ECF8E" opacity="0.10"/>

  <!-- ==== patient / pose skeleton ==== -->
  <g stroke="#3ECF8E" stroke-width="2.6" stroke-linecap="round" fill="none">
    <!-- torso + legs -->
    <line x1="220" y1="176" x2="220" y2="222"/>
    <line x1="220" y1="222" x2="206" y2="266"/>
    <line x1="220" y1="222" x2="234" y2="266"/>
    <!-- static arm -->
    <line x1="220" y1="188" x2="198" y2="210"/>
    <line x1="198" y1="210" x2="192" y2="236"/>
    <!-- raising arm (rehab motion) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 220 188; -46 220 188; 0 220 188"
                        dur="4s" repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      <line x1="220" y1="188" x2="244" y2="208"/>
      <line x1="244" y1="208" x2="252" y2="234"/>
      <circle cx="244" cy="208" r="3.4" fill="#0d1117" stroke="#3ECF8E" stroke-width="2"/>
      <circle cx="252" cy="234" r="4" fill="#3ECF8E" stroke="none">
        <animate attributeName="r" values="4;6.5;4" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <!-- head -->
  <circle cx="220" cy="160" r="12" fill="#0d1117" stroke="#3ECF8E" stroke-width="2.6"/>
  <!-- keypoints -->
  <g fill="#0d1117" stroke="#3ECF8E" stroke-width="2">
    <circle cx="220" cy="176" r="3.4"/>
    <circle cx="220" cy="222" r="3.4"/>
    <circle cx="198" cy="210" r="3.4"/>
    <circle cx="206" cy="266" r="3.4"/>
    <circle cx="234" cy="266" r="3.4"/>
  </g>
  <!-- scan line -->
  <line x1="176" y1="150" x2="264" y2="150" stroke="#58A6FF" stroke-width="1.4" opacity="0.7">
    <animate attributeName="y1" values="150;270;150" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="150;270;150" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0" dur="4.5s" repeatCount="indefinite"/>
  </line>

  <!-- ==== camera rig LEFT ==== -->
  <g>
    
    <g stroke="#3d4757" stroke-width="3" stroke-linecap="round">
      <line x1="72" y1="206" x2="60" y2="272"/>
      <line x1="72" y1="206" x2="84" y2="272"/>
      <line x1="72" y1="206" x2="72" y2="272"/>
    </g>
    <rect x="46" y="176" width="46" height="28" rx="6" fill="#161d27" stroke="#3ECF8E" stroke-width="2"/>
    <rect x="88" y="184" width="10" height="12" rx="3" fill="#161d27" stroke="#3ECF8E" stroke-width="2"/>
    <circle cx="63" cy="190" r="7.5" fill="#0d1117" stroke="#3ECF8E" stroke-width="2"/>
    <circle cx="63" cy="190" r="3" fill="#3ECF8E" opacity="0.8"/>
    <circle cx="80" cy="182" r="2.6" fill="#3ECF8E">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==== camera rig RIGHT ==== -->
  <g>
    <g stroke="#3d4757" stroke-width="3" stroke-linecap="round">
      <line x1="368" y1="206" x2="356" y2="272"/>
      <line x1="368" y1="206" x2="380" y2="272"/>
      <line x1="368" y1="206" x2="368" y2="272"/>
    </g>
    <rect x="348" y="176" width="46" height="28" rx="6" fill="#161d27" stroke="#58A6FF" stroke-width="2"/>
    <rect x="342" y="184" width="10" height="12" rx="3" fill="#161d27" stroke="#58A6FF" stroke-width="2"/>
    <circle cx="377" cy="190" r="7.5" fill="#0d1117" stroke="#58A6FF" stroke-width="2"/>
    <circle cx="377" cy="190" r="3" fill="#58A6FF" opacity="0.8"/>
    <circle cx="360" cy="182" r="2.6" fill="#58A6FF">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==== HUD panel ==== -->
  <g>
    <rect x="150" y="26" width="140" height="72" rx="10" fill="#0f1620" stroke="#232c38"/>
    <circle cx="163" cy="39" r="3" fill="#3ECF8E">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="173" y="36" width="46" height="5" rx="2.5" fill="#30363d"/>
    <!-- reward curve -->
    <polyline points="162,86 180,80 196,68 212,70 228,58 246,52 264,44 278,40"
              fill="none" stroke="#3ECF8E" stroke-width="2.4" stroke-linecap="round"
              stroke-linejoin="round" opacity="0.18"/>
    <polyline points="162,86 180,80 196,68 212,70 228,58 246,52 264,44 278,40"
              fill="none" stroke="#3ECF8E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="180" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" values="180;0;0;180" dur="5s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="278" cy="40" r="3.6" fill="#3ECF8E">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==== labels ==== -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#6e7c8e">
    <text x="46" y="168">CAM 01</text>
    <text x="348" y="168">CAM 02</text>
    <text x="228" y="41">policy reward</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#3ECF8E">
    <text x="290" y="304" text-anchor="end">pose · rl · embedded</text>
  </g>
</svg>
