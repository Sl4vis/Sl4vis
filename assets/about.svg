<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290" role="img" aria-label="Vision to edge compute to neural inference pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#121b25"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#3ECF8E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.38" cy="0.34">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1b3a5c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="chipFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18222e"/>
      <stop offset="100%" stop-color="#0f1620"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="438" height="288" rx="16" fill="url(#bg)" stroke="#232c38"/>
  <rect x="1" y="1" width="438" height="288" rx="16" fill="url(#dots)" opacity="0.4"/>
  <ellipse cx="220" cy="142" rx="180" ry="88" fill="url(#halo)"/>

  <!-- ============ 1. COMPUTER VISION ============ -->
  <g>
    <circle cx="86" cy="142" r="27" fill="url(#lens)" stroke="#58A6FF" stroke-width="2.2"/>
    <circle cx="86" cy="142" r="17" fill="none" stroke="#58A6FF" stroke-width="1.4" opacity="0.65"/>
    <circle cx="86" cy="142" r="8"  fill="#58A6FF" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="77" cy="133" r="4" fill="#9BD1FF" opacity="0.7"/>
    <!-- detection box -->
    <g stroke="#3ECF8E" stroke-width="2.2" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
      <polyline points="48,116 48,104 60,104"/>
      <polyline points="112,104 124,104 124,116"/>
      <polyline points="124,168 124,180 112,180"/>
      <polyline points="60,180 48,180 48,168"/>
    </g>
  </g>

  <!-- ============ 2. EMBEDDED / EDGE ============ -->
  <g>
    <!-- piny -->
    <g stroke="#46586e" stroke-width="3" stroke-linecap="round">
      <line x1="176" y1="118" x2="164" y2="118"/><line x1="176" y1="134" x2="164" y2="134"/>
      <line x1="176" y1="150" x2="164" y2="150"/><line x1="176" y1="166" x2="164" y2="166"/>
      <line x1="264" y1="118" x2="276" y2="118"/><line x1="264" y1="134" x2="276" y2="134"/>
      <line x1="264" y1="150" x2="276" y2="150"/><line x1="264" y1="166" x2="276" y2="166"/>
      <line x1="196" y1="98" x2="196" y2="86"/><line x1="212" y1="98" x2="212" y2="86"/>
      <line x1="228" y1="98" x2="228" y2="86"/><line x1="244" y1="98" x2="244" y2="86"/>
      <line x1="196" y1="186" x2="196" y2="198"/><line x1="212" y1="186" x2="212" y2="198"/>
      <line x1="228" y1="186" x2="228" y2="198"/><line x1="244" y1="186" x2="244" y2="198"/>
    </g>
    <rect x="176" y="98" width="88" height="88" rx="10" fill="url(#chipFace)" stroke="#3ECF8E" stroke-width="2.2"/>
    <rect x="190" y="112" width="60" height="60" rx="6" fill="none" stroke="#2b6b56" stroke-width="1.4"/>
    <!-- die grid -->
    <g fill="#3ECF8E">
      <rect x="199" y="121" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="215" y="121" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="231" y="121" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="199" y="137" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></rect>
      <rect x="215" y="137" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect>
      <rect x="231" y="137" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></rect>
      <rect x="199" y="153" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></rect>
      <rect x="215" y="153" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="2.1s" repeatCount="indefinite"/></rect>
      <rect x="231" y="153" width="12" height="12" rx="2" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.4s" begin="0.15s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ============ 3. NEURAL NETWORK ============ -->
  <g>
    <g stroke="#2b6b56" stroke-width="1.1" opacity="0.6">
      <line x1="318" y1="112" x2="358" y2="128"/><line x1="318" y1="112" x2="358" y2="156"/>
      <line x1="318" y1="142" x2="358" y2="128"/><line x1="318" y1="142" x2="358" y2="156"/>
      <line x1="318" y1="172" x2="358" y2="128"/><line x1="318" y1="172" x2="358" y2="156"/>
      <line x1="358" y1="128" x2="396" y2="142"/><line x1="358" y1="156" x2="396" y2="142"/>
    </g>
    <g stroke="#58A6FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 120" filter="url(#soft)">
      <line x1="318" y1="112" x2="358" y2="156">
        <animate attributeName="stroke-dashoffset" values="40;-110" dur="2.2s" repeatCount="indefinite"/></line>
      <line x1="318" y1="172" x2="358" y2="128">
        <animate attributeName="stroke-dashoffset" values="40;-110" dur="2.2s" begin="0.7s" repeatCount="indefinite"/></line>
      <line x1="358" y1="128" x2="396" y2="142">
        <animate attributeName="stroke-dashoffset" values="40;-110" dur="2.2s" begin="1.3s" repeatCount="indefinite"/></line>
    </g>
    <g fill="#0d1117" stroke="#3ECF8E" stroke-width="2.2">
      <circle cx="318" cy="112" r="7"><animate attributeName="r" values="7;8.8;7" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="318" cy="142" r="7"><animate attributeName="r" values="7;8.8;7" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="318" cy="172" r="7"><animate attributeName="r" values="7;8.8;7" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#0d1117" stroke="#49C9C0" stroke-width="2.2">
      <circle cx="358" cy="128" r="7"><animate attributeName="r" values="7;8.8;7" dur="2.8s" begin="1.0s" repeatCount="indefinite"/></circle>
      <circle cx="358" cy="156" r="7"><animate attributeName="r" values="7;8.8;7" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <circle cx="396" cy="142" r="8" fill="#0d1117" stroke="#58A6FF" stroke-width="2.2"/>
    <circle cx="396" cy="142" r="3.2" fill="#58A6FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ prepojenia medzi stupnami ============ -->
  <g stroke="#2f3b4a" stroke-width="1.6" stroke-dasharray="4 5">
    <line x1="126" y1="142" x2="162" y2="142"/>
    <line x1="278" y1="142" x2="310" y2="142"/>
  </g>
  <g fill="#3ECF8E">
    <circle cx="0" cy="142" r="3.2" filter="url(#soft)">
      <animate attributeName="cx" values="126;162" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="142" r="3.2" filter="url(#soft)">
      <animate attributeName="cx" values="278;310" dur="1.9s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.9s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ popisky ============ -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#6e7c8e"
     letter-spacing="1.4" text-anchor="middle">
    <text x="86" y="232">VISION</text>
    <text x="220" y="232">EDGE</text>
    <text x="357" y="232">INFERENCE</text>
  </g>
</svg>
