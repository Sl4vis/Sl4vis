<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="Code brackets around a neural network" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#121b25"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#3ECF8E" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ECF8E"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="438" height="298" rx="16" fill="url(#bg)" stroke="#232c38"/>
  <rect x="1" y="1" width="438" height="298" rx="16" fill="url(#dots)" opacity="0.4"/>
  <ellipse cx="220" cy="150" rx="140" ry="95" fill="url(#halo)"/>

  <!-- code brackets -->
  <g fill="none" stroke="#2f3b4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="72,108 44,150 72,192"/>
    <polyline points="368,108 396,150 368,192"/>
  </g>

  <!-- edges (staticke, tlmene) -->
  <g stroke="#2b6b56" stroke-width="1.1" opacity="0.55">
    <line x1="150" y1="112" x2="220" y2="96"/><line x1="150" y1="112" x2="220" y2="132"/>
    <line x1="150" y1="112" x2="220" y2="168"/><line x1="150" y1="112" x2="220" y2="204"/>
    <line x1="150" y1="150" x2="220" y2="96"/><line x1="150" y1="150" x2="220" y2="132"/>
    <line x1="150" y1="150" x2="220" y2="168"/><line x1="150" y1="150" x2="220" y2="204"/>
    <line x1="150" y1="188" x2="220" y2="96"/><line x1="150" y1="188" x2="220" y2="132"/>
    <line x1="150" y1="188" x2="220" y2="168"/><line x1="150" y1="188" x2="220" y2="204"/>
    <line x1="220" y1="96"  x2="290" y2="130"/><line x1="220" y1="96"  x2="290" y2="170"/>
    <line x1="220" y1="132" x2="290" y2="130"/><line x1="220" y1="132" x2="290" y2="170"/>
    <line x1="220" y1="168" x2="290" y2="130"/><line x1="220" y1="168" x2="290" y2="170"/>
    <line x1="220" y1="204" x2="290" y2="130"/><line x1="220" y1="204" x2="290" y2="170"/>
  </g>

  <!-- aktivne signaly -->
  <g stroke="url(#flow)" stroke-width="2" stroke-linecap="round" fill="none"
     stroke-dasharray="16 300" filter="url(#soft)">
    <line x1="150" y1="112" x2="220" y2="132">
      <animate attributeName="stroke-dashoffset" values="60;-260" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="150" x2="220" y2="204">
      <animate attributeName="stroke-dashoffset" values="60;-260" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="188" x2="220" y2="96">
      <animate attributeName="stroke-dashoffset" values="60;-260" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="132" x2="290" y2="170">
      <animate attributeName="stroke-dashoffset" values="60;-260" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="204" x2="290" y2="130">
      <animate attributeName="stroke-dashoffset" values="60;-260" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="96" x2="290" y2="130">
      <animate attributeName="stroke-dashoffset" values="60;-260" dur="2.6s" begin="2.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- neurony -->
  <g fill="#0d1117" stroke="#3ECF8E" stroke-width="2.4">
    <circle cx="150" cy="112" r="9"><animate attributeName="r" values="9;11;9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="9"><animate attributeName="r" values="9;11;9" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="188" r="9"><animate attributeName="r" values="9;11;9" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#0d1117" stroke="#49C9C0" stroke-width="2.4">
    <circle cx="220" cy="96"  r="9"><animate attributeName="r" values="9;11;9" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="132" r="9"><animate attributeName="r" values="9;11;9" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="168" r="9"><animate attributeName="r" values="9;11;9" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="204" r="9"><animate attributeName="r" values="9;11;9" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#0d1117" stroke="#58A6FF" stroke-width="2.4">
    <circle cx="290" cy="130" r="9"><animate attributeName="r" values="9;11.5;9" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="170" r="9"><animate attributeName="r" values="9;11.5;9" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- jadra neuronov -->
  <g fill="#3ECF8E">
    <circle cx="150" cy="112" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="188" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#58A6FF">
    <circle cx="290" cy="130" r="3.2"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="170" r="3.2"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
